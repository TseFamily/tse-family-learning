version = "1"

[project]
name = "LearningQuest"

[build]
strategy = "dockerfile"
dockerfile = "Dockerfile"
context = "."

[[services]]
name = "web"
type = "web"
port = 3000
watch_paths = [
  "index.html",
  "questions.json",
  "manifest.webmanifest",
  "sw.js",
  "server.js",
  "package.json",
  "content-packs/**",
  "Dockerfile",
  "sylphx.toml",
]

[services.build]
strategy = "dockerfile"
dockerfile = "Dockerfile"
context = "."

[services.health]
mode = "http"
path = "/"
