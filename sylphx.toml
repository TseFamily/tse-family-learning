version = "1"

[project]
name = "LearningQuest"

[build]
strategy = "dockerfile"
dockerfile = "Dockerfile"
context = "."

# Sold compute is a typeless Apps [[services]] row named web (service name).
# Leftover type and build_only are leftover, not dest; Apps typed-refuses a type key.
[[services]]
name = "web"
port = 3000
watch_paths = [
  "index.html",
  "questions.json",
  "manifest.webmanifest",
  "sw.js",
  "server.js",
  "package.json",
  "content-packs/**",
  "icons/**",
  "Dockerfile",
  "sylphx.toml",
]

[services.build]
strategy = "dockerfile"
dockerfile = "Dockerfile"
context = "."

[services.health]
mode = "http"
path = "/"
