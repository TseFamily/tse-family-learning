name: CI

# Fast Trunk (Agent-native):
# - Aggregate source verdict: source-ci/pass
# - CI = source correctness only; Platform builds production once
# - Merge Queue off by default (no merge_group trigger)
# - Concurrency cancels superseded PR/branch tip runs

on:
  merge_group:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read

concurrency:
  # Fast Trunk: supersede obsolete runs for the same PR or branch tip.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Record Bun pin
        run: bun --version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate static app
        run: bun test
      - name: Build
        run: bun run build
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: Mobile app shell smoke test
        run: bunx playwright test
